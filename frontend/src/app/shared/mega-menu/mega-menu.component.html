<div class="rounded-[32px] border border-black/10 bg-white p-6 shadow-soft">
  <div class="grid gap-6 lg:grid-cols-[1.3fr_0.7fr]">
    <!-- Listado de Categorías -->
    <div class="grid gap-4 sm:grid-cols-2 md:grid-cols-3">
      <div 
        *ngFor="let category of categories" 
        class="rounded-[24px] border border-black/10 p-4 transition duration-200 hover:-translate-y-0.5 hover:border-black/30 hover:shadow-sm bg-[#FAFAFA] flex flex-col justify-between"
      >
        <a 
          [routerLink]="['/catalogo']" 
          [queryParams]="{ categoria: category.slug }" 
          (click)="itemClick.emit()" 
          class="block group cursor-pointer"
        >
          <span class="text-[10px] uppercase font-bold tracking-[0.25em] text-[#EAC7D2]">{{ category.slug }}</span>
          <h4 class="mt-1 text-base font-bold text-[#111111] group-hover:text-[#EAC7D2] transition-colors">{{ category.nombre }}</h4>
          <p class="mt-1 text-xs text-black/60 line-clamp-2 font-editorial">{{ category.descripcion }}</p>
        </a>

        <!-- Subcategorías si existen -->
        <div *ngIf="category.subcategorias && category.subcategorias.length > 0" class="mt-3 pt-2.5 border-t border-black/5 flex flex-wrap gap-1">
          <a
            *ngFor="let sub of category.subcategorias"
            [routerLink]="['/catalogo']"
            [queryParams]="{ categoria: category.slug, search: sub }"
            (click)="itemClick.emit()"
            class="text-[11px] font-medium text-black/70 hover:text-[#111111] bg-white px-2 py-0.5 rounded-md border border-black/5 hover:border-black/20 transition font-editorial"
          >
            {{ sub }}
          </a>
        </div>
      </div>
    </div>

    <!-- Banner lateral de Colección destacada -->
    <div class="overflow-hidden rounded-[28px] bg-[#F6EFEA] p-5 flex flex-col justify-between">
      <div>
        <span class="inline-flex items-center gap-1.5 rounded-full bg-[#EAC7D2] px-3 py-1 text-[10px] font-bold uppercase tracking-[0.2em] text-[#111111]">
          Colección
        </span>
        <h3 class="font-serif-elegant text-2xl font-bold mt-2 text-[#111111]">Encuentra tu estilo</h3>
        <p class="text-xs text-black/60 mt-1 font-editorial">Piezas confeccionadas para tu descanso y confort diario.</p>
      </div>
      <img [src]="highlightImage" alt="Colección destacada" class="mt-4 h-44 w-full rounded-[20px] object-cover shadow-sm">
    </div>
  </div>
</div>
